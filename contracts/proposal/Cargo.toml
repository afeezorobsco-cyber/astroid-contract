[package]
name = "astroid-proposal"
description = "Astroid Proposal contract: approval lifecycle for actions awaiting sign-off, linked to wallet/policy/org."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
astroid-shared = { workspace = true }
astroid-interfaces = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
