[package]
name = "astroid-wallet"
description = "Astroid Wallet contract: programmable, stateful custody wallets with freeze/pause/archive lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
astroid-shared = { workspace = true }
astroid-interfaces = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
